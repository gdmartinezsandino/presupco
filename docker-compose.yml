version: "3.9"

services:
  server:
    container_name: ${APP_NAME}-server
    build:
      context: ./server
      dockerfile: Dockerfile
      target: ${NODE_ENV}
      args:
        NODE_VERSION: ${NODE_VERSION}
        NODE_ENV: ${NODE_ENV}
    environment:
      - NODE_VERSION=${NODE_VERSION}
      - NODE_ENV=${NODE_ENV}
      - APP_NAME=${APP_NAME}
      - APP_URL=${APP_URL}
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
    ports:
      - "${SERVER_PORT}:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  database:
    image: postgres:15
    container_name: ${APP_NAME}-database
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ${APP_NAME}-redis
    ports:
      - "${REDIS_PORT}:6379"
