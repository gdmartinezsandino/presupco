    role="form"
    aria-label="Forgot password form"

    <div class="form-actions">

  <p class="disclaimer-text">
    Do you already have an account?
    <a 
      href="javascript:void(0)" 
      (click)="goTo('login')" 
      (keydown.enter)="goTo('login')"
      (keydown.space)="goTo('login')"
