<section class="change-password-page">
  <header class="change-password-page__header">
    <h1>Change Password</h1>
    <p>Enter your new password below</p>
  </header>

  @if (changePasswordForm) {

      (ngSubmit)="onChangePassword()"
      (keyup.enter)="onChangePassword()"
      class="change-password-page__form"
      tabindex="0"
      role="form"
      aria-label="Change password form"
    >

          [type]="passwordVisible() ? 'text' : 'password'"

          [attr.aria-describedby]="'password-requirements'"
        >

          mat-icon-button

          <mat-error>
            Password is required
          </mat-error>

        >

          </mat-error>

      <div class="password-requirements" id="password-requirements" role="region" aria-label="Password requirements">
        <h4>Password requirements:</h4>
        <ul role="list">
          <li [class.valid]="!getField('password')?.errors?.['minLength']">
            Minimum 8 characters
          </li>
          <li [class.valid]="!getField('password')?.errors?.['uppercase']">
            At least one uppercase letter
          </li>
          <li [class.valid]="!getField('password')?.errors?.['number']">
            At least one number
          </li>
          <li [class.valid]="!getField('password')?.errors?.['specialChar']">
            At least one special character (e.g. @, $, !, %, *, ?, &)
          </li>
        </ul>
      </div>

      <button
        mat-raised-button
        color="primary"
        class="w-full"
        [disabled]="!changePasswordForm.valid || !changePasswordForm.dirty"
      >
        Change Password
      </button>

      <div class="login-link">
        <a (click)="goTo('/login')">Back to Login</a>
      </div>
    </form>
  }
</section>
